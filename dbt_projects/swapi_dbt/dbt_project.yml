name: swapi_dbt
version: "1.0.0"

profile: swapi_dbt

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

models:
  swapi_dbt:
    staging:
      +materialized: view
      +schema: staging
    raw_vault:
      +materialized: table
      +schema: raw_vault
    marts:
      +materialized: table
      +schema: marts
